<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Lý Sân Bóng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
<div class="container-fluid bg-white p-4 rounded shadow-sm">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-danger fw-bold">🛡️ MÀN HÌNH THEO DÕI TOÀN BỘ HOẠT ĐỘNG SÂN BÓNG</h2>
        <a href="/logout" class="btn btn-outline-secondary">Đăng xuất</a>
    </div>

    <div class="row text-center mb-4">
        <div class="col-md-4"><div class="card bg-primary text-white p-3"><h5>Tổng Lượt Đặt</h5><h3>12</h3></div></div>
        <div class="col-md-4"><div class="card bg-warning text-dark p-3"><h5>Sân Đang Đá</h5><h3>3</h3></div></div>
        <div class="col-md-4"><div class="card bg-success text-white p-3"><h5>Doanh Thu Hôm Nay</h5><h3>3.500.000 VNĐ</h3></div></div>
    </div>

    <h5 class="fw-bold text-secondary">Tất Cả Lượt Đặt Sân Trong Hệ Thống</h5>
    <table class="table table-striped table-bordered align-middle">
        <thead class="table-dark">
            <tr>
                <th>Mã</th>
                <th>Khách Hàng / Đội Bóng</th>
                <th>Sân</th>
                <th>Ngày Đặt</th>
                <th>Giờ Đá</th>
                <th>Tiền Cọc</th>
                <th>Trạng Thái</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ds : ${danhSachDatSan}">
                <td th:text="${ds.maLuotDat}"></td>
                <td th:text="${ds.khachHang.tenDoiBong}"></td>
                <td th:text="${ds.sanBong.tenSan}"></td>
                <td th:text="${ds.ngayDat}"></td>
                <td th:text="${ds.gioBatDau} + ' - ' + ${ds.gioKetThuc}"></td>
                <td th:text="${ds.tienCoc} + ' VNĐ'"></td>
                <td><span class="badge bg-success" th:text="${ds.trangThai}"></span></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container" style="max-width: 400px;">
    <div class="card p-4 shadow-sm">
        <h3 class="text-center text-primary fw-bold mb-3">ĐĂNG NHẬP</h3>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <form action="/login" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập / SĐT:</label>
                <input type="text" name="username" class="form-control" required/>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Mật khẩu:</label>
                <input type="password" name="password" class="form-control" required/>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng Nhập</button>
        </form>
        <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="/register">Đăng ký ngay</a></p>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - Sân Bóng Đá Mini</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">
<div class="container" style="max-width: 480px;">
    <div class="card p-4 shadow border-0 rounded-3">
        <h3 class="text-center text-primary fw-bold mb-3">📝 ĐĂNG KÝ TÀI KHOẢN</h3>

        <form th:action="@{/register}" th:object="${khachHangMoi}" method="post">
            <div class="mb-2">
                <label class="form-label fw-bold">Số CCCD / CMT:</label>
                <input type="text" th:field="*{cccdCmt}" class="form-control" placeholder="Nhập số CCCD" required/>
            </div>

            <div class="mb-2">
                <label class="form-label fw-bold">Tên Đội Bóng / Đại Diện:</label>
                <input type="text" th:field="*{tenDoiBong}" class="form-control" placeholder="Ví dụ: FC PTIT" required/>
            </div>

            <div class="row mb-2">
                <div class="col-6">
                    <label class="form-label fw-bold">Họ & Đệm:</label>
                    <input type="text" th:field="*{hoTendem}" class="form-control" placeholder="Nguyễn Văn"/>
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold">Tên:</label>
                    <input type="text" th:field="*{ten}" class="form-control" placeholder="An" required/>
                </div>
            </div>

            <div class="mb-2">
                <label class="form-label fw-bold">Số Điện Thoại (dùng làm Tên đăng nhập):</label>
                <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="0987654321" required/>
            </div>

            <!-- BỔ SUNG Ô NHẬP MẬT KHẨU -->
            <div class="mb-3">
                <label class="form-label fw-bold">Mật Khẩu:</label>
                <input type="password" name="matKhau" class="form-control" placeholder="Nhập mật khẩu" required/>
            </div>

            <button type="submit" class="btn btn-success w-100 fw-bold py-2">XÁC NHẬN ĐĂNG KÝ</button>
        </form>

        <hr/>
        <p class="text-center mb-0">Đã có tài khoản? <a href="/login" class="fw-bold text-decoration-none">Đăng nhập ngay</a></p>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - PTIT Football</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 p-4">
                    <h3 class="fw-bold text-center text-success mb-3">📝 ĐĂNG KÝ TÀI KHOẢN</h3>
                    
                    <form th:action="@{/register}" th:object="${khachHangMoi}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Họ và Tên (*):</label>
                            <input type="text" th:field="*{ten}" class="form-control" placeholder="Nhập tên của bạn" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số Điện Thoại (*):</label>
                            <input type="text" th:field="*{soDienThoai}" class="form-control" placeholder="Ví dụ: 0987654321" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Số CCCD / CMT (Tối đa 10 số):</label>
                            <input type="text" th:field="*{cccdCmt}" class="form-control" maxlength="10" placeholder="Nhập số CCCD/CMT (nếu có)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Đội Bóng:</label>
                            <input type="text" th:field="*{tenDoiBong}" class="form-control" placeholder="Tên đội bóng của bạn">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mật Khẩu (*):</label>
                            <input type="password" name="matKhau" class="form-control" placeholder="Nhập mật khẩu" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2">ĐĂNG KÝ TÀI KHOẢN</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="/login" class="text-decoration-none text-muted small">Đã có tài khoản? Đăng nhập ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

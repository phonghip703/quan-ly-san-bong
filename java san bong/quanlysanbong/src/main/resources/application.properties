spring.application.name=quanlysanbong
server.port=8080

# Kết nối Aiven Cloud MySQL
spring.datasource.url=jdbc:mysql://mysql-39cb7d7e-phonghip1105-e531.c.aivencloud.com:13025/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình HikariCP chống treo kết nối SSL với Aiven
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.keepalive-time=30000

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt tự động chạy data.sql
spring.sql.init.mode=never
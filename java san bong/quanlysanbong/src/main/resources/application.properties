spring.application.name=quanlysanbong
server.port=8080

# Kết nối Aiven Cloud MySQL (Dùng useSSL=true & verifyServerCertificate=false để tránh lỗi SSL Handshake)
spring.datasource.url=jdbc:mysql://mysql-39cb7d7e-phonghip1105-e531.c.aivencloud.com:13025/defaultdb?useSSL=true&verifyServerCertificate=false
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Khai báo Dialect cố định để Spring Boot không cần query metadata khi khởi động
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt tự động chạy data.sql để tránh trùng dữ liệu
spring.sql.init.mode=never
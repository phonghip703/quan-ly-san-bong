spring.application.name=quanlysanbong
server.port=8080

# 1. Cấu hình kết nối MySQL (Đã chỉ định rõ Database quan_ly_san_bong)
spring.datasource.url=jdbc:mysql://localhost:3306/quan_ly_san_bong?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root

# ⚠️ LƯU Ý: Thay MẬT KHẨU MySQL của bạn ở dòng dưới (ví dụ: 123456 hoặc root)
spring.datasource.password=phong123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Cấu hình Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Cấu hình H2 Database chạy trực tiếp trên bộ nhớ RAM của Render
spring.datasource.url=jdbc:h2:mem:quanlysanbong;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect và tự động tạo bảng dữ liệu
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Cho phép xem giao diện quản lý DB (Tùy chọn)
spring.h2.console.enabled=true
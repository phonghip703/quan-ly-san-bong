spring.application.name=quanlysanbong
server.port=8080

# Cấu hình H2 Database (In-Memory) chạy trực tiếp trên Render
spring.datasource.url=jdbc:h2:mem:quanlysanbong;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect Hibernate cho H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cho phép truy cập giao diện quản lý H2 Console (đường dẫn /h2-console)
spring.h2.console.enabled=true
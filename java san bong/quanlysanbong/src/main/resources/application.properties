spring.application.name=quanlysanbong
server.port=8080

# Cấu hình Aiven Cloud MySQL
spring.datasource.url=jdbc:mysql://mysql-39cb7d7e-phonghip1105-e531.c.aivencloud.com:13025/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Chỉ định Dialect trực tiếp cho MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt tự động chạy data.sql để tránh trùng dữ liệu
spring.sql.init.mode=never
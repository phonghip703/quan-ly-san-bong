spring.application.name=quanlysanbong
server.port=8080

# Kết nối Aiven Cloud MySQL
spring.datasource.url=jdbc:mysql://mysql-39cb7d7e-phonghip1105-e531.c.aivencloud.com:13025/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tắt Open Session In View để trả kết nối về HikariPool ngay lập tức sau khi truy vấn xong
spring.jpa.open-in-view=false

# Cấu hình HikariCP phát hiện và ngắt kết nối bị kẹt quá 5 giây (Leak Detection)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=5000

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt tự động chạy data.sql
spring.sql.init.mode=never
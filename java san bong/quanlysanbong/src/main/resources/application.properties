spring.application.name=quanlysanbong
server.port=8080

# Ket noi Aiven Cloud MySQL
spring.datasource.url=jdbc:mysql://mysql-39cb7d7e-phonghip1105-e531.c.aivencloud.com:13025/defaultdb?ssl-mode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ⚠️ BẮT BUỘC: Ép Spring Boot chạy data.sql trên MySQL sau khi Hibernate tạo bảng xong
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true